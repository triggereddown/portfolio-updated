<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeuomorphic Toggle UI - Dark Neon Blue Reference</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#050811] flex items-center justify-center min-h-screen p-6 antialiased" style="background-image: radial-gradient(circle at 50% 50%, #0d1629 0%, #050811 100%);">

    <!-- Skeuomorphic Toggle Control (Dark Neon Edition) -->
    <div 
        id="skeuomorphic-toggle" 
        role="switch" 
        aria-checked="true" 
        tabindex="0" 
        class="relative z-10 w-48 h-16 rounded-full p-1.5 cursor-pointer select-none outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
        style="
            background: repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 2px, rgba(0,0,0,0.35) 2px, rgba(0,0,0,0.35) 4px), linear-gradient(180deg, #0e245c 0%, #173d94 50%, #0b1a40 100%);
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.65), inset 0 -2px 4px rgba(59, 130, 246, 0.35), 0 0 0 2px rgba(37, 99, 235, 0.7), 0 0 20px 4px rgba(37, 99, 235, 0.65), 0 0 45px 8px rgba(29, 78, 216, 0.35);
            border: 1px solid #3b82f6;
            transition: background 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
        "
    >
        <!-- Skeuomorphic Thumb -->
        <div 
            id="skeuomorphic-thumb" 
            class="absolute top-1.5 left-1.5 w-[116px] h-[calc(100%-0.75rem)] rounded-full flex items-center justify-center"
            style="
                background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 45%, #94a3b8 100%);
                box-shadow: 0 10px 24px -2px rgba(0, 0, 0, 0.7), 0 3px 6px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.95), inset 0 -2px 4px rgba(30, 58, 138, 0.35);
                border: 1px solid rgba(255,255,255,0.8);
                transform: translateX(64px);
                transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
            "
        >
            <span 
                class="text-sm font-medium tracking-wide text-slate-800" 
                style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-shadow: 0 1px 1px rgba(255,255,255,0.85); transition: color 0.35s ease, opacity 0.35s ease;"
            >
                Live Sync
            </span>
        </div>
    </div>

    <script>
        (function () {
            var toggle = document.getElementById('skeuomorphic-toggle');
            var thumb = document.getElementById('skeuomorphic-thumb');
            var label = thumb && thumb.querySelector('span');
            if (!toggle || !thumb) return;

            var ON_BG = 'repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 2px, rgba(0,0,0,0.35) 2px, rgba(0,0,0,0.35) 4px), linear-gradient(180deg, #0e245c 0%, #173d94 50%, #0b1a40 100%)';
            var OFF_BG = 'repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, rgba(0,0,0,0.4) 2px, rgba(0,0,0,0.4) 4px), linear-gradient(180deg, #1e2433 0%, #121622 100%)';
            
            var ON_SHADOW = 'inset 0 3px 6px rgba(0,0,0,0.65), inset 0 -2px 4px rgba(59, 130, 246, 0.35), 0 0 0 2px rgba(37, 99, 235, 0.7), 0 0 20px 4px rgba(37, 99, 235, 0.65), 0 0 45px 8px rgba(29, 78, 216, 0.35)';
            var OFF_SHADOW = 'inset 0 4px 8px rgba(0,0,0,0.8), inset 0 -1px 2px rgba(255,255,255,0.05), 0 0 0 1px rgba(51, 65, 85, 0.6), 0 0 10px rgba(0,0,0,0.4)';
            
            var ON_BORDER = '#3b82f6';
            var OFF_BORDER = '#334155';

            var ON_THUMB_SHADOW = '0 10px 24px -2px rgba(0, 0, 0, 0.7), 0 3px 6px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.95), inset 0 -2px 4px rgba(30, 58, 138, 0.35)';
            var OFF_THUMB_SHADOW = '0 8px 18px -2px rgba(0, 0, 0, 0.7), 0 2px 4px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.8), inset 0 -2px 3px rgba(15, 23, 42, 0.4)';

            function travel() {
                return Math.max(0, toggle.clientWidth - thumb.clientWidth - 12);
            }

            function apply(on) {
                toggle.setAttribute('aria-checked', on ? 'true' : 'false');
                toggle.style.background = on ? ON_BG : OFF_BG;
                toggle.style.boxShadow = on ? ON_SHADOW : OFF_SHADOW;
                toggle.style.borderColor = on ? ON_BORDER : OFF_BORDER;
                thumb.style.transform = 'translateX(' + (on ? travel() : 0) + 'px)';
                thumb.style.boxShadow = on ? ON_THUMB_SHADOW : OFF_THUMB_SHADOW;
                if (label) {
                    label.style.opacity = on ? '1' : '0.65';
                    label.style.color = on ? '#0f172a' : '#475569';
                }
            }

            function flip() {
                apply(toggle.getAttribute('aria-checked') !== 'true');
            }

            apply(true);
            toggle.addEventListener('click', flip);
            toggle.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    flip();
                }
            });
            window.addEventListener('resize', function () {
                apply(toggle.getAttribute('aria-checked') === 'true');
            });
        })();
    </script>
</body>
</html>
